name: ci

on:
  push:
    branches: [master, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install poppler (pdftotext) for the parse-ptr smoke test
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Parse a fixture through the CLI
        run: cargo run -q -- parse-ptr tests/fixtures/house_ptr_20035143.txt

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r python/requirements.txt
      - run: python -m py_compile python/autotrades.py
      - run: python python/autotrades.py --selftest
