[package]
name = "autotrades"
version = "0.1.0"
edition = "2024"
description = "Mirror publicly disclosed trades (STOCK Act PTRs, SEC 13F) and news signals into an Interactive Brokers paper account, controlled from Telegram."
license = "MIT"

[dependencies]
# runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "signal"] }

# broker
ibapi = "4.2"

# http / scraping
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "form", "cookies", "gzip"] }
scraper = "0.27"
roxmltree = "0.21"
zip = { version = "8", default-features = false, features = ["deflate"] }
feed-rs = "3"

# telegram
teloxide = { version = "0.17", features = ["macros"] }

# storage / config
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
dotenvy = "0.15"

# misc
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
regex = "1"
tempfile = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
