# autotrades configuration. Copy to autotrades.toml and edit.
# Secrets (Telegram token, API keys) live in the environment / .env, never here.

db_path = "autotrades.db"
poll_interval_secs = 900          # how often every source is polled
max_disclosure_age_days = 10      # ignore filings older than this when first seen
dry_run = true                    # log orders instead of sending them (toggle with /dryrun)
max_order_usd = 10000             # hard ceiling per order, whatever the pilot says

[ibkr]
host = "127.0.0.1"
port = 7497                       # TWS paper = 7497, IB Gateway paper = 4002
client_id = 17
require_paper_account = true      # refuse to trade a live account

[sources]
house = true                      # House Clerk PTR index + PDFs
senate = true                     # Senate eFD
bargo = true                      # free aggregator, usually the fastest signal
edgar_13f = true                  # SEC EDGAR 13F-HR
# sec_user_agent = "autotrades you@example.com"   # or set SEC_USER_AGENT

[telegram]
enabled = true                    # needs TELEGRAM_BOT_TOKEN and TELEGRAM_OWNER_ID

[news]
enabled = false                   # needs ANTHROPIC_API_KEY
model = "claude-opus-5"
feeds = [
  "https://feeds.a.dj.com/rss/RSSMarketsMain.xml",
  "https://www.cnbc.com/id/100003114/device/rss/rss.html",
  "https://news.google.com/rss/search?q=stock+market+when:1d&hl=en-US&gl=US&ceid=US:en",
]

# ---- pilots ---------------------------------------------------------------
# `enabled` and `allocation_usd` can be overridden at runtime from Telegram
# (/follow pelosi 5000, /unfollow pelosi); those overrides persist in the DB.

[[pilots]]
id = "pelosi"
kind = "politician"
match = "Pelosi"                  # substring of the disclosed name, case-insensitive
chamber = "house"
enabled = true
allocation_usd = 10000            # total cost basis this pilot may hold
per_trade_usd = 1000              # notional for a $1,001-$15,000 disclosure
scale_by_amount = true            # bigger disclosed buckets -> up to 8x
max_position_usd = 4000

[[pilots]]
id = "crenshaw"
kind = "politician"
match = "Crenshaw"
chamber = "house"
enabled = false
allocation_usd = 5000
per_trade_usd = 500

[[pilots]]
id = "tuberville"
kind = "politician"
match = "Tuberville"
chamber = "senate"
enabled = false
allocation_usd = 5000
per_trade_usd = 500

[[pilots]]
id = "berkshire"
kind = "thirteen_f"
cik = 1067983                     # Berkshire Hathaway
enabled = false
allocation_usd = 20000
top_n = 15
min_trade_usd = 100

[[pilots]]
id = "scion"
kind = "thirteen_f"
cik = 1649339                     # Scion Asset Management (Michael Burry)
enabled = false
allocation_usd = 5000
